name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify ChatGPT nested embed security and readiness
        run: pnpm test:embed
      - name: Bootstrap local production topology
        run: pnpm stack:bootstrap
      - name: Verify console bounds and authoritative controller actions
        run: pnpm test:gameplay-controls
      - name: Run browser multiplayer scenarios
        run: pnpm test:e2e
      - name: Collect container logs
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose -f docker-compose.yml -f docker-compose.local.yml --profile admin logs --tail=250
          else
            echo "Integration stack was not bootstrapped; no container logs to collect."
          fi
      - name: Stop integration stack
        if: always()
        run: |
          if [ -f .env ]; then
            pnpm stack:down
          else
            echo "Integration stack was not bootstrapped; nothing to stop."
          fi

  prepare-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Convex production sources
        run: |
          pnpm turbo run build --filter=@play-together/security
          pnpm typecheck:convex

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare-production]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve canonical production origin
        shell: bash
        run: |
          origin="$(node --input-type=module -e 'import { ciTooling } from "./scripts/environment/ci-tooling.mjs"; const value=ciTooling.find((entry)=>entry.name==="E2E_BASE_URL")?.production; if (!value?.startsWith("https://")) process.exit(1); process.stdout.write(value);')"
          echo "MANAGED_PRODUCTION_URL=$origin" >> "$GITHUB_ENV"
      - name: Wait for CI-approved VPS revision
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            if payload=$(curl -fsS --max-time 10 "$MANAGED_PRODUCTION_URL/api/health") && \
              node -e 'const p=JSON.parse(process.argv[1]); if (p.runtime !== "vps-managed" || p.revision !== process.argv[2] || p.readyRevision !== process.argv[2]) process.exit(1)' "$payload" "$GITHUB_SHA"; then
              exit 0
            fi
            sleep 5
          done
          echo "VPS did not deploy the CI-approved revision $GITHUB_SHA" >&2
          exit 1
      - name: Verify distributed realtime control plane
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if payload=$(curl -fsS --max-time 10 "$MANAGED_PRODUCTION_URL/api/realtime") && \
              node -e 'const payload=JSON.parse(process.argv[1]); if (payload.coordination !== "distributed" || payload.releaseControl !== "ready" || payload.observability?.schemaVersion !== 1) process.exit(1);' "$payload"; then
              exit 0
            fi
            sleep 2
          done
          echo "VPS realtime control plane did not become ready" >&2
          exit 1
      - name: Install browser for production smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Run VPS production browser scenarios
        run: >-
          E2E_BASE_URL="$MANAGED_PRODUCTION_URL"
          E2E_REALTIME_HEALTH_URL="$MANAGED_PRODUCTION_URL/api/realtime"
          pnpm test:e2e
